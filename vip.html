<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VIP</title>
  <link rel="stylesheet" href="vip.css">
</head>
<body>
  <main class="vip-screen">
    <section class="vip-hero">
      <div class="vip-kicker">WXS GAME · VIP</div>
      <h2 id="rank">Без ранга</h2>
      <p id="turnover">Оборот: 0.00 $</p>
      <div class="vip-progress-label"><span>Прогресс ранга</span><strong id="pct">0%</strong></div>
      <div class="vip-progress-track"><i id="fill"></i></div>
      <div class="vip-next" id="nextTier">Следующий ранг</div>
      <p class="vip-status" id="rewardStatus" role="status">Загрузка наград…</p>
      <button class="vip-retry" id="retryRewards" type="button" hidden>Повторить загрузку</button>
      <div class="vip-milestones" id="milestones"></div>
    </section>
    <p class="vip-section-title">Привилегии <span>Нажми, чтобы узнать подробнее</span></p>
    <section class="vip-cards">
      <button class="vip-card" data-info="rake" type="button"><span class="vip-card-icon">↻</span><small>Рейкбек</small><b>1.5%</b><i>›</i></button>
      <button class="vip-card" data-info="cash" type="button"><span class="vip-card-icon">✦</span><small>Кешбек</small><b>5%</b><i>›</i></button>
      <button class="vip-card" data-info="daily" type="button"><span class="vip-card-icon">★</span><small>Ежедневка</small><b id="daily">0.20 $</b><i>›</i></button>
      <button class="vip-card" data-info="boost" type="button"><span class="vip-card-icon">ϟ</span><small>Буст</small><b>VIP</b><i>›</i></button>
    </section>
    <p class="vip-section-title">Все ранги</p>
    <div class="vip-ranks" id="ranks"></div>
  </main>
  <div class="vip-sheet-layer" id="sheetLayer" aria-hidden="true">
    <div class="vip-sheet-backdrop" data-close-sheet></div>
    <section class="vip-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button class="vip-sheet-handle-zone" id="sheetHandle" type="button" aria-label="Закрыть подробности"><span></span></button>
      <div class="vip-sheet-icon" id="sheetIcon"></div>
      <h2 id="sheetTitle"></h2><p id="sheetBody"></p>
      <button class="vip-sheet-close" id="sheetClose" type="button">Закрыть</button>
    </section>
  </div>
  <script src="vip.js"></script>
</body>
</html>
